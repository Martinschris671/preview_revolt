<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Preview v1.0</title>
    <style>
      /* --- CLEAN & PROFESSIONAL INITIAL LOOK --- */
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        transition: background 0.1s;
      }

      #previewBtn {
        font-size: 4rem;
        padding: 40px 80px;
        background: #ffffff;
        color: #1e3c72;
        border: none;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        font-weight: bold;
        position: absolute;
        transition: all 0.2s ease-out;
        animation: pulse 2s infinite;
      }

      #previewBtn span {
        font-size: 1.5rem;
        font-weight: normal;
        display: block;
        margin-top: 10px;
        color: #666;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 30px 60px rgba(0, 255, 255, 0.4);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
      }

      /* --- ANNOYING POST-CLICK ANIMATIONS --- */
      @keyframes rainbow {
        0% {
          background: #ff0000;
        }
        20% {
          background: #ffff00;
        }
        40% {
          background: #00ff00;
        }
        60% {
          background: #00ffff;
        }
        80% {
          background: #ff00ff;
        }
        100% {
          background: #ff0000;
        }
      }

      @keyframes spin {
        100% {
          transform: rotate(3600deg) scale(2);
        }
      }

      @keyframes shake {
        0% {
          transform: translate(1px, 1px) rotate(0deg);
        }
        10% {
          transform: translate(-1px, -2px) rotate(-1deg);
        }
        20% {
          transform: translate(-3px, 0px) rotate(1deg);
        }
        30% {
          transform: translate(3px, 2px) rotate(0deg);
        }
        40% {
          transform: translate(1px, -1px) rotate(1deg);
        }
        50% {
          transform: translate(-1px, 2px) rotate(-1deg);
        }
        60% {
          transform: translate(-3px, 1px) rotate(0deg);
        }
        70% {
          transform: translate(3px, 1px) rotate(-1deg);
        }
        80% {
          transform: translate(-1px, -1px) rotate(1deg);
        }
        90% {
          transform: translate(1px, 2px) rotate(0deg);
        }
        100% {
          transform: translate(1px, -2px) rotate(-1deg);
        }
      }

      .giant-annoying-text {
        font-size: 8rem;
        font-weight: 900;
        color: white;
        text-align: center;
        text-shadow: 10px 10px 0px black;
        animation: shake 0.1s infinite;
        z-index: 10;
        pointer-events: none;
      }

      .fake-popup {
        position: absolute;
        background: #e0e0e0;
        border: 2px solid #333;
        border-top: 30px solid #0055ff;
        padding: 20px;
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: red;
        animation: pulse 0.5s infinite;
        z-index: 5;
        user-select: none;
      }

      .fake-popup::before {
        content: "System Error 404";
        position: absolute;
        top: -22px;
        left: 5px;
        color: white;
        font-family: sans-serif;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <button id="previewBtn">
      VIEW APP PREVIEW
      <span>(Click to launch testing environment)</span>
    </button>

    <script>
      const btn = document.getElementById("previewBtn");
      let hoverCount = 0;

      // Phase 1: The Runaway Button
      btn.addEventListener("mouseenter", () => {
        if (hoverCount < 5) {
          // Move the button randomly across the screen
          const x = Math.random() * (window.innerWidth - btn.offsetWidth - 20);
          const y =
            Math.random() * (window.innerHeight - btn.offsetHeight - 20);

          btn.style.left = `${x}px`;
          btn.style.top = `${y}px`;

          // Change text to mock him
          const messages = [
            "Oops! Too slow!",
            "Missed me!",
            "Is your mouse broken?",
            "Bro, aim better!",
            "Okay okay, I'll stop. Click me.",
          ];
          btn.innerHTML = `${messages[hoverCount]}<br><span>(Seriously, click it)</span>`;

          hoverCount++;
        }
      });

      // Phase 2: The Annoying Payload
      btn.addEventListener("click", () => {
        // Remove the button
        btn.style.display = "none";

        // Make the background flash rainbow colors
        document.body.style.animation = "rainbow 0.2s infinite";

        // Add the giant shaking text
        const giantText = document.createElement("div");
        giantText.className = "giant-annoying-text";
        giantText.innerHTML =
          "DOWNLOADING BROWSER HISTORY...<br>SENDING TO MOM... 99%<br><br>GOTCHA BRO 😂";
        document.body.appendChild(giantText);

        // Annoying messages to spam the screen
        const annoyingMessages = [
          "Deleting System32...",
          "Error: You are too gullible",
          "App Feature: Stealing your snacks",
          "Uploading embarrassing photos...",
          "Hacking mainframe...",
          "Downloading RAM...",
          "Your shoe is untied",
          "Formatting hard drive...",
          "Virus.exe successfully installed",
          "Bro you fell for it!",
        ];

        // Spam popups across the screen infinitely
        setInterval(() => {
          const popup = document.createElement("div");
          popup.className = "fake-popup";
          popup.innerText =
            annoyingMessages[
              Math.floor(Math.random() * annoyingMessages.length)
            ];

          // Random position
          popup.style.left = Math.random() * 80 + "vw";
          popup.style.top = Math.random() * 80 + "vh";

          // Random rotation
          popup.style.transform = `rotate(${Math.random() * 360}deg)`;

          document.body.appendChild(popup);

          // Play a tiny beep sound (sometimes browsers block this, but it's funny if it works)
          try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            osc.type = "square";
            osc.frequency.setValueAtTime(
              400 + Math.random() * 1000,
              ctx.currentTime,
            );
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
          } catch (e) {}
        }, 150); // Spawns a new popup every 150 milliseconds!
      });
    </script>
  </body>
</html>
