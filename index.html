  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; }
  body{
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  /* "Revolut" wordmark: 54.3% of the screen width, centred just above the middle (like the ref) */
  .logo{
    position:absolute; top:47.6%; left:50%; transform:translate(-50%,-50%);
    width:54.3%; max-width:280px; color:#fff;
    animation:logo-in .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .logo svg{ display:block; width:100%; height:auto; }
  @keyframes logo-in{ from{ opacity:0; transform:translate(-50%,-50%) scale(.9); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
  @media (prefers-reduced-motion:reduce){ .logo{ animation:none; } }
</style>
