<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dodaj novac</title>
<link rel="stylesheet" href="add-money.css">
<script src="page-transition.js"></script>
</head>
<body>
<main class="screen">

  <!-- ============ header ============ -->
  <header class="hdr">
    <button class="glass back" id="back" aria-label="Natrag">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M1 11.992c0-0.276 0.105-0.536 0.306-0.738L6.73 5.833c0.359-0.359 0.94-0.359 1.3 0l0.324 0.325c0.36 0.36 0.36 0.94 0 1.3L4.96 10.85h12.12c0.509 0 0.92 0.412 0.92 0.92v0.46c0 0.507-0.411 0.918-0.92 0.918H4.96l3.394 3.394c0.36 0.36 0.36 0.94 0 1.3L8.03 18.168c-0.359 0.359-0.94 0.359-1.3 0l-5.423-5.422C1.102 12.54 1 12.268 1 11.992z"/></svg>
    </button>
    <div class="titles">
      <div class="title">Dodaj novac</div>
      <div class="saldo">Saldo: <span id="balance">0 €</span></div>
    </div>
  </header>

  <!-- ============ amount + method ============ -->
  <section class="mid" id="mid">
    <div class="amount" id="amount">
      <span class="val" id="amountVal">100</span><span class="caret"></span><span class="cur">€</span>
    </div>

      <span class="label">Apple Pay · EUR</span>
      <svg class="chev" viewBox="0 0 16 9" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1.6 1.6L8 7.4l6.4-5.8"/></svg>
    </button>
  </section>

  <!-- ============ status, pay, operators, keypad ============ -->
  <section class="bottom" id="bottom">
    <div class="status-line"><b>Stiže</b> · Obično odmah</div>

    <button class="pay-btn" id="payBtn" aria-label="Plati s Apple Payem">
      <svg class="apple" viewBox="4 32 365 449" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span class="pay">Pay</span>
    </button>

    <div class="ops">
      <button class="glass op" data-op="+" aria-label="Plus"><span>+</span></button>
      <button class="glass op" data-op="-" aria-label="Minus"><span>-</span></button>
      <button class="glass op" data-op="*" aria-label="Puta"><span>×</span></button>
      <button class="glass op" data-op="/" aria-label="Podijeljeno"><span>÷</span></button>
      <button class="glass op" data-op="=" aria-label="Jednako"><span>=</span></button>
    </div>

    <div class="keys" id="keys">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key" data-k=",">,</button>
      <button class="key" data-k="0">0</button>
      <button class="key" data-k="back" aria-label="Obriši">
        <svg viewBox="0 0 38 31" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="3.2" d="M1.7 15.5L12.4 2.7c.6-.7 1.5-1.1 2.4-1.1h17.4c2.3 0 4.1 1.8 4.1 4.1v19.6c0 2.3-1.8 4.1-4.1 4.1H14.8c-.9 0-1.8-.4-2.4-1.1z"/>
          <path stroke-width="3.4" d="M17.2 10l10.6 11M27.8 10L17.2 21"/>
        </svg>
      </button>
    </div>
  </section>
</main>

<!-- ============ Apple Pay sheet ============ -->
<div class="pay-layer" id="payLayer" aria-hidden="true">
  <div class="side-bar"></div>
  <div class="side-hint">Pritisnite dvaput<br>za plaćanje</div>

  <div class="pay-sheet" id="paySheet" role="dialog" aria-modal="true" aria-label="Apple Pay">
    <div class="ps-head">
      <div class="ps-logo">
        <svg class="apple" viewBox="4 32 365 449" fill="#fff"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        <span class="pay">Pay</span>
      </div>
      <button class="glass ps-close" id="psClose" aria-label="Zatvori">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 10.56L6.74 5.3a1.02 1.02 0 0 0-1.44 1.44L10.56 12 5.3 17.26a1.02 1.02 0 0 0 1.44 1.44L12 13.44l5.26 5.26a1.02 1.02 0 0 0 1.44-1.44L13.44 12l5.26-5.26a1.02 1.02 0 0 0-1.44-1.44z"/></svg>
      </button>
    </div>

    <div class="ps-card">
      <div class="ps-thumb">
        <img src="assets/aircash-card.png" alt="">
        <svg class="ps-thumb-num" viewBox="0 0 1073 673" aria-hidden="true"><text x="64" y="618">•••• 3210</text></svg>
      </div>
      <div class="ps-card-name">Aircash Card</div>
      <div class="ps-card-num"><span class="dots"><i></i><i></i><i></i><i></i></span>3210</div>
    </div>

    <button class="ps-change">
      <span>Promijeni način plaćanja</span>
      <svg class="chev" viewBox="0 0 10 16" fill="none" stroke="#8e8e93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l6 6-6 6"/></svg>
    </button>

    <div class="ps-pay">
      <div class="ps-pay-label">Plati primatelju Revolut</div>
      <div class="ps-pay-amount" id="psAmount">100,00 €</div>
      <div class="ps-info" aria-label="Informacije">
        <svg viewBox="0 0 14 29" fill="#c7c7cc"><circle cx="7" cy="3.4" r="3"/><path d="M3.4 10.6h5.2v12.6h2.2c1 0 1.8.8 1.8 1.8s-.8 1.8-1.8 1.8H3.2c-1 0-1.8-.8-1.8-1.8s.8-1.8 1.8-1.8h1.6v-9H3.4c-1 0-1.8-.8-1.8-1.8s.8-1.8 1.8-1.8z"/></svg>
      </div>
    </div>

    <div class="ps-confirm">
      <div class="side-ico" id="sideGlyph" role="button" tabindex="0" aria-label="Potvrdite bočnom tipkom">
        <svg viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          <path class="sg-check" pathLength="1" d="M10.15 18.2 L15.4 23.1 L25.2 12.25"/>
          <path class="sg-ring" d="M17.5 0.75C8.24923 0.75 0.75 8.24923 0.75 17.5C0.75 26.7508 8.24923 34.25 17.5 34.25C26.7508 34.25 34.25 26.7508 34.25 17.5C34.25 8.24923 26.7508 0.75 17.5 0.75Z" stroke-width="1.5" stroke="#007AFF"/>

      <div class="side-text">Potvrdite bočnom tipkom</div>
    </div>
  </div>
</div>

<script src="bank-store.js"></script>

</body>
</html>
