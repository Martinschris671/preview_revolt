<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Preview Preview - Secure Environment</title>
    <style>
      /* --- PROFESSIONAL START --- */
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #0d1117;
        color: #c9d1d9;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        transition: background 0.1s;
        cursor: default; /* Will change to clown later */
      }

      #loadingScreen {
        text-align: center;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top: 5px solid #58a6ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px auto;
      }

      .loading-text {
        font-size: 1.2rem;
        font-family: monospace;
        color: #8b949e;
      }

      #previewBtn {
        display: none; /* Hidden until loaded */
        font-size: 3rem;
        padding: 30px 60px;
        background: linear-gradient(180deg, #2ea043 0%, #238636 100%);
        color: #ffffff;
        border: 1px solid rgba(240, 246, 252, 0.1);
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        font-weight: bold;
        position: absolute;
        transition: transform 0.1s ease-out;
        z-index: 100;
      }

      .decoy-btn {
        font-size: 2rem;
        padding: 20px 40px;
        background: #444;
        color: #777;
        border: none;
        border-radius: 12px;
        position: absolute;
        opacity: 0.5;
        z-index: 1;
        pointer-events: none;
      }

      /* --- THE CHAOS ANIMATIONS --- */
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes barrelRoll {
        0% {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(0.5);
        }
        100% {
          transform: rotate(360deg) scale(1.5);
        }
      }

      @keyframes extremeRainbow {
        0% {
          background: #ff0000;
        }
        10% {
          background: #ff8000;
        }
        20% {
          background: #ffff00;
        }
        30% {
          background: #80ff00;
        }
        40% {
          background: #00ff00;
        }
        50% {
          background: #00ff80;
        }
        60% {
          background: #00ffff;
        }
        70% {
          background: #0080ff;
        }
        80% {
          background: #0000ff;
        }
        90% {
          background: #8000ff;
        }
        100% {
          background: #ff0080;
        }
      }

      @keyframes violentShake {
        0% {
          transform: translate(5px, 5px) rotate(0deg);
        }
        10% {
          transform: translate(-5px, -10px) rotate(-5deg);
        }
        20% {
          transform: translate(-15px, 0px) rotate(5deg);
        }
        30% {
          transform: translate(15px, 10px) rotate(0deg);
        }
        40% {
          transform: translate(5px, -5px) rotate(5deg);
        }
        50% {
          transform: translate(-5px, 10px) rotate(-5deg);
        }
        60% {
          transform: translate(-15px, 5px) rotate(0deg);
        }
        70% {
          transform: translate(15px, 5px) rotate(-5deg);
        }
        80% {
          transform: translate(-5px, -5px) rotate(5deg);
        }
        90% {
          transform: translate(5px, 10px) rotate(0deg);
        }
        100% {
          transform: translate(5px, -10px) rotate(-5deg);
        }
      }

      .giant-annoying-text {
        font-size: 6rem;
        font-weight: 900;
        color: yellow;
        text-align: center;
        text-shadow:
          5px 5px 0px red,
          -5px -5px 0px blue;
        animation: violentShake 0.1s infinite;
        z-index: 1000;
        pointer-events: none;
        position: absolute;
        width: 100%;
        top: 30%;
      }

      .fake-popup {
        position: absolute;
        background: #c0c0c0;
        border: 2px solid #ffffff;
        border-right-color: #808080;
        border-bottom-color: #808080;
        border-top: 25px solid #000080;
        padding: 20px;
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
        font-family: "Tahoma", sans-serif;
        font-size: 14px;
        color: black;
        z-index: 500;
        user-select: none;
        min-width: 250px;
      }

      .fake-popup::before {
        content: "Critical Error - App.exe";
        position: absolute;
        top: -20px;
        left: 5px;
        color: white;
        font-weight: bold;
        font-size: 12px;
      }

      .popup-btn {
        display: block;
        margin: 15px auto 0 auto;
        padding: 5px 20px;
        background: #c0c0c0;
        border: 2px solid #ffffff;
        border-right-color: #808080;
        border-bottom-color: #808080;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Fake Loading Screen -->
    <div id="loadingScreen">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">
        Connecting to secure server...
      </div>
    </div>

    <!-- The Bait Button -->
    <button id="previewBtn">LAUNCH APP PREVIEW</button>

    <script>
      const loadingScreen = document.getElementById("loadingScreen");
      const loadingText = document.getElementById("loadingText");
      const btn = document.getElementById("previewBtn");
      let hoverCount = 0;

      // Phase 1: Fake Loading Sequence
      setTimeout(() => (loadingText.innerText = "Compiling assets..."), 1000);
      setTimeout(
        () => (loadingText.innerText = "Decrypting UI components..."),
        2000,
      );
      setTimeout(() => {
        loadingScreen.style.display = "none";
        btn.style.display = "block";

        // Center the button initially
        btn.style.left = window.innerWidth / 2 - btn.offsetWidth / 2 + "px";
        btn.style.top = window.innerHeight / 2 - btn.offsetHeight / 2 + "px";
      }, 3500);

      // Phase 2: The Runaway Button & Decoys
      btn.addEventListener("mouseenter", () => {
        if (hoverCount < 7) {
          // Leave a decoy button behind
          const decoy = document.createElement("div");
          decoy.className = "decoy-btn";
          decoy.innerText = "Too slow 🤡";
          decoy.style.left = btn.style.left;
          decoy.style.top = btn.style.top;
          document.body.appendChild(decoy);

          // Teleport the real button
          const x = Math.random() * (window.innerWidth - btn.offsetWidth - 50);
          const y =
            Math.random() * (window.innerHeight - btn.offsetHeight - 50);

          btn.style.left = `${x}px`;
          btn.style.top = `${y}px`;

          // Shrink the button slightly each time to make it harder
          btn.style.transform = `scale(${1 - hoverCount * 0.1})`;

          const messages = [
            "Missed me!",
            "Bro your aim is trash",
            "Are you even trying?",
            "Get your eyes checked",
            "My grandma clicks faster",
            "Okay fine, I'll stop.",
            "Click me now.",
          ];
          btn.innerText = messages[hoverCount];

          hoverCount++;
        } else {
          btn.style.transform = "scale(1)";
          btn.innerText = "ALRIGHT, LAUNCH APP";
        }
      });

      // Prevent him from just closing the tab easily
      window.addEventListener("beforeunload", (e) => {
        e.preventDefault();
        e.returnValue =
          "Are you sure you want to exit? Your search history is currently being uploaded.";
      });

      // Phase 3: THE PAYLOAD (100x Annoying)
      btn.addEventListener("click", () => {
        // Force Fullscreen
        try {
          document.documentElement.requestFullscreen();
        } catch (e) {}

        // Remove all buttons
        document.body.innerHTML = "";

        // Change Cursor to Giant Clown
        document.body.style.cursor =
          'url(\'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" style="font-size:48px"><text y="48">🤡</text></svg>\'), auto';

        // Visual Chaos: Seizure Rainbow + Spinning Page
        document.body.style.animation =
          "extremeRainbow 0.1s infinite, barrelRoll 4s infinite linear";

        // Add the giant shaking text
        const giantText = document.createElement("div");
        giantText.className = "giant-annoying-text";
        giantText.innerHTML =
          "SYSTEM COMPROMISED<br>UPLOADING BROWSER HISTORY<br>TO YOUR ENTIRE CONTACT LIST...<br>99% COMPLETE";
        document.body.appendChild(giantText);

        // AUDIO CHAOS 1: Text to Speech Insults
        if ("speechSynthesis" in window) {
          const insults = [
            "Warning. Rizz level is at zero percent.",
            "Analyzing browser history. Oh my god, bro, why did you search that?",
            "Uploading embarrassing photos to Facebook.",
            "You have been pranked. You fell for it. Absolute clown behavior.",
            "Initiating self destruct sequence in 3, 2, 1.",
          ];
          let speechStr = insults.join(" ");
          let msg = new SpeechSynthesisUtterance(speechStr);
          msg.rate = 1.2;
          msg.pitch = 0.5;
          msg.volume = 1;
          window.speechSynthesis.speak(msg);
        }

        // AUDIO CHAOS 2: Annoying Siren Beeps
        try {
          let ctx = new (window.AudioContext || window.webkitAudioContext)();
          setInterval(() => {
            let osc = ctx.createOscillator();
            osc.type = "sawtooth";
            // Alternate between high and low pitch like a siren
            osc.frequency.setValueAtTime(
              Math.random() > 0.5 ? 800 : 1200,
              ctx.currentTime,
            );
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
          }, 150);
        } catch (e) {}

        // POPUP CHAOS: The embarrassing search history
        const embarrassingSearches = [
          "How to get a girlfriend fast",
          "Why does my breath smell like pennies?",
          "Is it illegal to marry an anime character?",
          "How to look taller in pictures",
          "Am I adopted quiz",
          "How to refund V-bucks",
          "Why did she leave me on read?",
          "Cute cat videos 10 hours",
          "How to delete search history permanently",
          "What is grass and how to touch it",
        ];

        setInterval(() => {
          const popup = document.createElement("div");
          popup.className = "fake-popup";

          let randomSearch =
            embarrassingSearches[
              Math.floor(Math.random() * embarrassingSearches.length)
            ];
          popup.innerHTML = `<strong>Leaked Search:</strong><br>"${randomSearch}"<br><button class="popup-btn">OK</button>`;

          // Random position
          popup.style.left = Math.random() * 80 + "vw";
          popup.style.top = Math.random() * 80 + "vh";

          document.body.appendChild(popup);

          // Make the OK buttons do nothing but spawn MORE popups
          popup.querySelector("button").addEventListener("click", (e) => {
            e.stopPropagation();
            popup.style.display = "none";
            // Spawns 3 more when he tries to close 1
            for (let i = 0; i < 3; i++) {
              document.body.appendChild(popup.cloneNode(true));
            }
          });
        }, 200); // Spawns a new embarrassing popup every 200ms
      });
    </script>
  </body>
</html>
